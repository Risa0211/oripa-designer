name: スニダン価格インデックス 死活監視

on:
  schedule:
    # 追いかけ実行(JST 08:20/10:20)より後に見る。ここで鳴る＝追いかけでも直らなかった
    - cron: '30 2 * * *'   # JST 11:30
    - cron: '30 5 * * *'   # JST 14:30（念のためもう一度。監視自体の取りこぼし対策）
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google Service Account credentials
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > credentials.json

      - name: Check freshness
        env:
          CHATWORK_API_TOKEN: ${{ secrets.CHATWORK_API_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: python3 scripts/watchdog_index.py

      - name: Cleanup credentials
        if: always()
        run: rm -f credentials.json
